<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Automation Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            'glass': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
            'premium': '0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01)',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for media picker */
    .media-grid::-webkit-scrollbar {
      width: 6px;
    }
    .media-grid::-webkit-scrollbar-track {
      background: transparent; 
    }
    .media-grid::-webkit-scrollbar-thumb {
      background: #e2e8f0; 
      border-radius: 10px;
    }
    .media-grid::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1; 
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans min-h-screen selection:bg-indigo-100 selection:text-indigo-900">

  <!-- Navbar -->
  <nav class="bg-white/90 backdrop-blur-xl sticky top-0 z-40 border-b border-slate-200/80 shadow-[0_2px_20px_-5px_rgba(0,0,0,0.05)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-20">
        <div class="flex items-center">
          <!-- Official Instagram Logo SVG -->
          <div class="w-10 h-10 mr-3 flex items-center justify-center hover:scale-105 transition-transform cursor-pointer">
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
              <defs>
                <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#fd5949" />
                  <stop offset="50%" stop-color="#d6249f" />
                  <stop offset="100%" stop-color="#285AEB" />
                </linearGradient>
              </defs>
              <path fill="url(#ig-grad)" d="M256,49.471c67.266,0,75.233.257,101.8,1.469,24.562,1.121,37.9,5.224,46.778,8.674a78.052,78.052,0,0,1,28.966,18.845,78.052,78.052,0,0,1,18.845,28.966c3.45,8.877,7.554,22.216,8.674,46.778,1.212,26.565,1.469,34.532,1.469,101.8s-.257,75.233-1.469,101.8c-1.121,24.562-5.225,37.9-8.674,46.778a83.427,83.427,0,0,1-47.811,47.811c-8.877,3.45-22.216,7.554-46.778,8.674-26.56,1.212-34.527,1.469-101.8,1.469s-75.237-.257-101.8-1.469c-24.562-1.121-37.9-5.225-46.778-8.674a78.051,78.051,0,0,1-28.966-18.845,78.053,78.053,0,0,1-18.845-28.966c-3.45-8.877-7.554-22.216-8.674-46.778-1.212-26.564-1.469-34.532-1.469-101.8s.257-75.233,1.469-101.8c1.121-24.562,5.224-37.9,8.674-46.778A78.052,78.052,0,0,1,78.458,78.458a78.053,78.053,0,0,1,28.966-18.845c8.877-3.45,22.216-7.554,46.778-8.674,26.565-1.212,34.532-1.469,101.8-1.469m0-45.391c-68.418,0-77,.29-103.866,1.516-26.815,1.224-45.127,5.482-61.151,11.71A123.488,123.488,0,0,0,46.366,46.366,123.488,123.488,0,0,0,17.31,91.983c-6.227,16.025-10.485,34.337-11.71,61.151C4.373,179,4.083,187.582,4.083,256s.29,77,1.516,103.866c1.224,26.815,5.482,45.127,11.71,61.151a123.489,123.489,0,0,0,29.056,45.617,123.486,123.486,0,0,0,45.617,29.056c16.025,6.227,34.337,10.485,61.151,11.71,26.87,1.226,35.449,1.516,103.866,1.516s77-.29,103.866-1.516c26.815-1.224,45.127-5.482,61.151-11.71a128.817,128.817,0,0,0,74.673-74.673c6.227-16.025,10.485-34.337,11.71-61.151,1.226-26.87,1.516-35.449,1.516-103.866s-.29-77-1.516-103.866c-1.224-26.815-5.482-45.127-11.71-61.151a123.486,123.486,0,0,0-29.056-45.617A123.488,123.488,0,0,0,421.017,17.31c-16.025-6.227-34.337-10.485-61.151-11.71C333,4.373,324.418,4.08,256,4.08Z"/>
              <path fill="url(#ig-grad)" d="M256,126.636A129.364,129.364,0,1,0,385.364,256,129.364,129.364,0,0,0,256,126.636Zm0,213.336A83.972,83.972,0,1,1,340.033,256,83.972,83.972,0,0,1,256,339.972Z"/>
              <circle fill="url(#ig-grad)" cx="390.476" cy="121.524" r="30.23"/>
            </svg>
          </div>
          <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-600 tracking-tight">Automation <span class="font-medium text-slate-400">Dashboard</span></h1>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col md:flex-row gap-8">
    
    <!-- Left Column: Add Campaign Form -->
    <div class="w-full md:w-[380px] shrink-0">
      <div class="bg-white rounded-2xl shadow-premium border border-slate-200/60 p-6 sticky top-24 transition-all hover:shadow-lg">
        <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center">
          <i class="fa-solid fa-wand-magic-sparkles text-indigo-500 mr-2"></i> Create Campaign
        </h2>
        
        <form id="campaign-form" class="space-y-5">
          <!-- Keyword -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Trigger Keyword</label>
            <input type="text" id="keyword" required placeholder="e.g. guide" 
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
            <p class="text-[11px] text-slate-500 mt-1.5">The word users must comment.</p>
          </div>

          <!-- Message -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">DM Message</label>
            <textarea id="replyMessage" required rows="4" placeholder="Here is your link! https://..." 
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all resize-none"></textarea>
          </div>

          <!-- Media ID (Optional) -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Target Post (Optional)</label>
            <div class="flex space-x-2">
              <input type="text" id="mediaId" placeholder="Global (All Posts)" readonly
                class="w-full px-4 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-slate-500 focus:outline-none cursor-not-allowed">
              <button type="button" id="btn-open-picker" class="px-5 py-2.5 bg-white border border-slate-200 shadow-sm text-slate-700 font-medium rounded-xl hover:bg-slate-50 hover:border-slate-300 transition-all whitespace-nowrap">
                <i class="fa-regular fa-image mr-1 text-indigo-500"></i> Select
              </button>
            </div>
            <div id="selected-media-preview" class="hidden mt-3 flex items-center bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
              <img id="preview-img" src="" class="w-12 h-12 object-cover rounded-lg mr-3 shadow-sm">
              <div class="text-xs text-slate-600 truncate flex-1 font-medium leading-relaxed" id="preview-caption"></div>
              <button type="button" id="btn-clear-media" class="text-slate-400 hover:text-red-500 ml-2 p-2 transition-colors" title="Clear selection">
                <i class="fa-solid fa-circle-xmark text-lg"></i>
              </button>
            </div>
            <p class="text-[11px] text-slate-500 mt-1.5">Leave empty to trigger on ANY post.</p>
          </div>

          <!-- Error Message -->
          <div id="form-error" class="hidden text-sm font-medium text-red-600 bg-red-50 border border-red-100 p-3 rounded-xl"></div>

          <!-- Submit -->
          <button type="submit" id="btn-submit" 
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-premium text-sm font-bold text-white bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:-translate-y-0.5">
            Save Campaign
          </button>
        </form>
      </div>
    </div>

    <!-- Right Column: Active Campaigns List -->
    <div class="w-full md:flex-1">
      <div class="bg-white rounded-2xl shadow-premium border border-slate-200/60 overflow-hidden">
        <div class="px-6 py-5 border-b border-slate-200/60 flex justify-between items-center bg-slate-50/50">
          <h2 class="text-lg font-bold text-slate-900 flex items-center">
            <i class="fa-solid fa-layer-group text-slate-400 mr-2"></i> Active Campaigns
          </h2>
          <button id="btn-refresh" class="text-slate-400 hover:text-indigo-600 transition-colors bg-white border border-slate-200 rounded-lg p-2 hover:shadow-sm">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>
        
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200/60">
            <thead class="bg-slate-50/80">
              <tr>
                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-slate-500 uppercase tracking-wider">Keyword</th>
                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-slate-500 uppercase tracking-wider">Target Post</th>
                <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-slate-500 uppercase tracking-wider">DM Message</th>
                <th scope="col" class="px-6 py-4 text-right text-[11px] font-bold text-slate-500 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="campaigns-tbody" class="bg-white divide-y divide-slate-100">
              <!-- Rows will be populated by JS -->
              <tr>
                <td colspan="4" class="px-6 py-10 text-center text-sm text-gray-500">Loading campaigns...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Media Picker Modal -->
  <div id="media-modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
      
      <!-- Background overlay -->
      <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" aria-hidden="true"></div>

      <!-- Modal panel -->
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
      <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl w-full border border-slate-200">
        <div class="bg-white px-6 pt-6 pb-6">
          <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
            <h3 class="text-xl font-extrabold text-slate-900 tracking-tight flex items-center" id="modal-title">
              <i class="fa-brands fa-instagram text-pink-500 mr-2"></i> Select Instagram Post
            </h3>
            <button type="button" id="btn-close-modal" class="text-slate-400 hover:text-slate-600 focus:outline-none bg-slate-100 hover:bg-slate-200 p-2 rounded-full transition-colors">
              <i class="fa-solid fa-xmark text-lg w-5 h-5 flex items-center justify-center"></i>
            </button>
          </div>
          
          <div id="media-error" class="hidden text-sm font-medium text-red-600 bg-red-50 border border-red-100 p-4 rounded-xl mb-6"></div>
          
          <div id="media-loading" class="py-20 text-center text-slate-500">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-indigo-500"></i>
            <p class="font-medium">Fetching your beautiful grid...</p>
          </div>

          <!-- Grid -->
          <div id="media-grid-container" class="hidden h-[500px] overflow-y-auto media-grid pr-3">
            <div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5">
              <!-- Media items populated by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
